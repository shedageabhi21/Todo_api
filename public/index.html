<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }
    .app { width: 100%; max-width: 600px; }
    h1 { font-size: 28px; font-weight: 600; color: #111; letter-spacing: -0.5px; }
    .subtitle { font-size: 14px; color: #888; margin-top: 4px; margin-bottom: 1.5rem; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.5rem; }
    .stat { background: #fff; border-radius: 10px; padding: 12px 16px; border: 1px solid #eee; }
    .stat-label { font-size: 12px; color: #999; margin-bottom: 4px; }
    .stat-value { font-size: 24px; font-weight: 600; color: #111; }
    .input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
    .input-row input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; background: #fff; }
    .input-row input:focus { border-color: #111; }
    .input-row input::placeholder { color: #bbb; }
    .btn-add { padding: 10px 20px; background: #111; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn-add:hover { background: #333; }
    .filters { display: flex; gap: 6px; margin-bottom: 1rem; }
    .filter-btn { padding: 6px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; background: #fff; color: #666; cursor: pointer; }
    .filter-btn.active { background: #111; color: #fff; border-color: #111; }
    .todo-list { display: flex; flex-direction: column; gap: 8px; }
    .todo-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #fff; border: 1px solid #eee; border-radius: 12px; transition: border-color 0.15s; }
    .todo-item:hover { border-color: #ccc; }
    .todo-item.done { opacity: 0.6; }
    .check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: transparent; }
    .check.checked { background: #111; border-color: #111; }
    .check.checked::after { content: ''; display: block; width: 6px; height: 10px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translateY(-1px); }
    .todo-title { flex: 1; font-size: 15px; color: #111; }
    .todo-item.done .todo-title { text-decoration: line-through; color: #aaa; }
    .todo-tag { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: #f0f0f0; color: #888; }
    .btn-del { width: 28px; height: 28px; border: none; background: transparent; color: #ccc; cursor: pointer; border-radius: 6px; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .btn-del:hover { background: #fff0f0; color: #e00; }
    .empty { text-align: center; padding: 3rem 0; color: #bbb; font-size: 14px; }
    .clear-btn { margin-top: 1.5rem; text-align: center; }
    .clear-btn button { border: none; background: none; font-size: 13px; color: #aaa; cursor: pointer; text-decoration: underline; }
    .clear-btn button:hover { color: #e00; }
    .error { color: red; font-size: 13px; margin-top: 6px; display: none; }
  </style>
</head>
<body>
  <div class="app">
    <h1>My Tasks</h1>
    <p class="subtitle">Stay on top of your work</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Done</div>
        <div class="stat-value" id="stat-done">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Remaining</div>
        <div class="stat-value" id="stat-remaining">0</div>
      </div>
    </div>

    <div class="input-row">
      <input type="text" id="todo-input" placeholder="Add a new task..." />
      <button class="btn-add" onclick="addTodo()">Add task</button>
    </div>
    <div class="error" id="error-msg">Title is required!</div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
      <button class="filter-btn" onclick="setFilter('done', this)">Done</button>
    </div>

    <div class="todo-list" id="todo-list"></div>

    <div class="clear-btn">
      <button onclick="clearDone()">Clear completed tasks</button>
    </div>
  </div>

  <script>
    const API = '';

    async function fetchTodos() {
      const res = await fetch(`${API}/todos`);
      return res.json();
    }

    async function createTodo(title) {
      const res = await fetch(`${API}/todos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      return res.json();
    }

    async function updateTodo(id, data) {
      const res = await fetch(`${API}/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      return res.json();
    }

    async function deleteTodoApi(id) {
      await fetch(`${API}/todos/${id}`, { method: 'DELETE' });
    }

    let filter = 'all';

    async function render() {
      const todos = await fetchTodos();
      const filtered = todos.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done
      );
      const done = todos.filter(t => t.done).length;
      document.getElementById('stat-total').textContent = todos.length;
      document.getElementById('stat-done').textContent = done;
      document.getElementById('stat-remaining').textContent = todos.length - done;

      const list = document.getElementById('todo-list');
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">No tasks here</div>';
        return;
      }

      list.innerHTML = filtered.map(t => `
        <div class="todo-item ${t.done ? 'done' : ''}">
          <div class="check ${t.done ? 'checked' : ''}" onclick="toggle(${t.id}, ${t.done})"></div>
          <span class="todo-title">${t.title}</span>
          ${t.done ? '<span class="todo-tag">done</span>' : ''}
          <button class="btn-del" onclick="remove(${t.id})">&#x2715;</button>
        </div>
      `).join('');
    }

    async function addTodo() {
      const input = document.getElementById('todo-input');
      const title = input.value.trim();
      const error = document.getElementById('error-msg');
      if (!title) {
        error.style.display = 'block';
        return;
      }
      error.style.display = 'none';
      await createTodo(title);
      input.value = '';
      render();
    }

    async function toggle(id, done) {
      await updateTodo(id, { done: !done });
      render();
    }

    async function remove(id) {
      await deleteTodoApi(id);
      render();
    }

    async function clearDone() {
      const todos = await fetchTodos();
      const doneTodos = todos.filter(t => t.done);
      await Promise.all(doneTodos.map(t => deleteTodoApi(t.id)));
      render();
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('todo-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') addTodo();
      });
      render();
    });
  </script>
</body>
</html>
