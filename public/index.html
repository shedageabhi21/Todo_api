<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }
    .app {
      width: 100%;
      max-width: 620px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }
    .header-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
    }
    .header p {
      font-size: 13px;
      color: #999;
      margin-top: 2px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .stat {
      background: #f8f9ff;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      border: 1px solid #eef0ff;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #667eea;
    }
    .stat-label {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
    }
    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #eef0ff;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      color: #1a1a2e;
    }
    .input-row input:focus {
      border-color: #667eea;
    }
    .input-row input::placeholder { color: #bbb; }
    .btn-add {
      padding: 12px 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .btn-add:hover { opacity: 0.85; }
    .error {
      color: #e74c3c;
      font-size: 12px;
      margin-bottom: 8px;
      display: none;
      padding-left: 4px;
    }
    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 1rem;
    }
    .filter-btn {
      padding: 7px 16px;
      border: 2px solid #eef0ff;
      border-radius: 20px;
      font-size: 13px;
      background: #fff;
      color: #999;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border-color: transparent;
    }
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #fff;
      border: 2px solid #eef0ff;
      border-radius: 14px;
      transition: all 0.2s;
    }
    .todo-item:hover {
      border-color: #667eea;
      box-shadow: 0 4px 12px rgba(102,126,234,0.1);
    }
    .todo-item.done { opacity: 0.6; background: #fafafa; }
    .check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #ddd;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .check:hover { border-color: #667eea; }
    .check.checked {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
    }
    .check.checked::after {
      content: '';
      display: block;
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
    }
    .todo-title {
      flex: 1;
      font-size: 15px;
      color: #1a1a2e;
      font-weight: 500;
    }
    .todo-item.done .todo-title {
      text-decoration: line-through;
      color: #bbb;
    }
    .todo-tag {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      background: #f0fff4;
      color: #27ae60;
      font-weight: 600;
    }
    .btn-del {
      width: 30px;
      height: 30px;
      border: none;
      background: #fff5f5;
      color: #e74c3c;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .btn-del:hover { background: #e74c3c; color: #fff; }
    .empty {
      text-align: center;
      padding: 3rem 0;
      color: #bbb;
      font-size: 14px;
    }
    .empty-icon { font-size: 40px; margin-bottom: 10px; }
    .footer {
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer span { font-size: 12px; color: #bbb; }
    .clear-btn {
      border: none;
      background: none;
      font-size: 12px;
      color: #e74c3c;
      cursor: pointer;
      font-weight: 500;
    }
    .clear-btn:hover { text-decoration: underline; }
    .loading {
      text-align: center;
      padding: 2rem;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="header">
        <div class="header-icon">✅</div>
        <div>
          <h1>My Tasks</h1>
          <p>Stay on top of your work</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-done">0</div>
          <div class="stat-label">Done</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-remaining">0</div>
          <div class="stat-label">Remaining</div>
        </div>
      </div>

      <div class="input-row">
        <input type="text" id="todo-input" placeholder="Add a new task..." />
        <button class="btn-add" onclick="addTodo()">+ Add</button>
      </div>
      <div class="error" id="error-msg">⚠️ Title is required!</div>

      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
        <button class="filter-btn" onclick="setFilter('done', this)">Done</button>
      </div>

      <div class="todo-list" id="todo-list">
        <div class="loading">Loading tasks...</div>
      </div>

      <div class="footer">
        <span id="footer-text">0 tasks</span>
        <button class="clear-btn" onclick="clearDone()">Clear completed</button>
      </div>
    </div>
  </div>

  <script>
    const API = '';
    let filter = 'all';

    async function fetchTodos() {
      const res = await fetch(`${API}/todos`);
      return res.json();
    }

    async function createTodo(title) {
      const res = await fetch(`${API}/todos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      return res.json();
    }

    async function updateTodo(id, data) {
      const res = await fetch(`${API}/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      return res.json();
    }

    async function deleteTodoApi(id) {
      await fetch(`${API}/todos/${id}`, { method: 'DELETE' });
    }

    async function render() {
      const todos = await fetchTodos();
      const filtered = todos.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done
      );
      const done = todos.filter(t => t.done).length;

      document.getElementById('stat-total').textContent = todos.length;
      document.getElementById('stat-done').textContent = done;
      document.getElementById('stat-remaining').textContent = todos.length - done;
      document.getElementById('footer-text').textContent = `${todos.length} task${todos.length !== 1 ? 's' : ''}`;

      const list = document.getElementById('todo-list');

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🎉</div>
            <div>${filter === 'done' ? 'No completed tasks yet' : filter === 'active' ? 'No active tasks!' : 'No tasks yet — add one above!'}</div>
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(t => `
        <div class="todo-item ${t.done ? 'done' : ''}">
          <div class="check ${t.done ? 'checked' : ''}" onclick="toggle(${t.id}, ${t.done})"></div>
          <span class="todo-title">${t.title}</span>
          ${t.done ? '<span class="todo-tag">✓ done</span>' : ''}
          <button class="btn-del" onclick="remove(${t.id})" title="Delete">✕</button>
        </div>
      `).join('');
    }

    async function addTodo() {
      const input = document.getElementById('todo-input');
      const title = input.value.trim();
      const error = document.getElementById('error-msg');
      if (!title) { error.style.display = 'block'; return; }
      error.style.display = 'none';
      await createTodo(title);
      input.value = '';
      render();
    }

    async function toggle(id, done) {
      await updateTodo(id, { done: !done });
      render();
    }

    async function remove(id) {
      await deleteTodoApi(id);
      render();
    }

    async function clearDone() {
      const todos = await fetchTodos();
      await Promise.all(todos.filter(t => t.done).map(t => deleteTodoApi(t.id)));
      render();
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('todo-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') addTodo();
      });
      render();
    });
  </script>
</body>
</html>
